<section aria-label="Tide">
	<h3>Tide</h3>
	<label class="checkbox-label"><input data-global-enabled type="checkbox"> Tide-Plugin aktiv</label>
	<div data-locations class="plugin-location-list"></div>
	<button class="button" type="button" data-add><i data-lucide="plus" aria-hidden="true"></i> Tide-Standort hinzuf&uuml;gen</button>
	<template data-location-template>
		<fieldset class="plugin-location-editor">
			<legend>Tide-Standort</legend>
			<div class="master-fields">
				<label>Name<input data-field="name" maxlength="120" required></label>
				<label>Website-Link<input data-field="url" type="url" maxlength="2048" placeholder="https://..."></label>
				<label>Breitengrad<input data-field="latitude" type="number" min="-90" max="90" step="any" required></label>
				<label>L&auml;ngengrad<input data-field="longitude" type="number" min="-180" max="180" step="any" required></label>
				<label>BSH-Pegelkennung<input data-bsh-station maxlength="120" title="BSH-Pegelkennung; Name und Koordinaten ordnen keinen Pegel automatisch zu."></label>
				<datalist data-stations>
					<option value="hamburg_st-pauli">Hamburg, St. Pauli</option>
					<option value="hamburg_seemannshoeft">Hamburg, Seemannshoeft</option>
					<option value="hamburg_blankenese">Hamburg, Blankenese</option>
					<option value="cuxhaven_steubenhoeft">Cuxhaven, Steubenhoeft</option>
					<option value="bremerhaven_alter_leuchtturm">Bremerhaven, Alter Leuchtturm</option>
					<option value="jade-weser-port">Jade-Weser-Port</option>
				</datalist>
			</div>
			<div class="plugin-location-selection">
				<label class="checkbox-label"><input data-enabled type="checkbox"> Tide anzeigen</label>
				<button class="button icon" type="button" data-remove title="Tide-Standort entfernen" aria-label="Tide-Standort entfernen"><i data-lucide="trash-2" aria-hidden="true"></i></button>
			</div>
		</fieldset>
	</template>
</section>
